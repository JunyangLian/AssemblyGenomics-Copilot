# 哺乳类（mammalia）注释指标基线。
# 来源：T3 群体校准 2026-10-05（population_reference，仅 advisory；
# 升级 enforce 须按 README 流程补 ≥2 条 published doi）。
- id: MAM-001
  metric: protein_coding_gene_count
  taxon_scope: mammalia
  unit: genes
  expected_range: [13000, 30000]
  source_type: population_reference
  enforce: false
  references:
    - text: "T3 群体实测（2026-10-05，~/临时 27 物种 RefSeq GFF+FAA，t3_batch_report.tsv）"
      doi: null
  notes: >
    群体实测 protein-coding gene（gene loci 中含 CDS 者）：2 种 18,152-21,248（n=2）。
    真兽类典型 ~20k；单孔目/有袋类可能越带

- id: MAM-002
  metric: median_protein_length
  taxon_scope: mammalia
  unit: aa
  expected_range: [440, 600]
  source_type: population_reference
  enforce: false
  references:
    - text: "T3 群体实测（2026-10-05，~/临时 27 物种 RefSeq GFF+FAA，t3_batch_report.tsv）"
      doi: null
  notes: >
    群体实测蛋白中位长度：503-538。
