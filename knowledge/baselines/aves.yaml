# 鸟类（aves）注释指标基线。
# 来源：T3 群体校准 2026-10-05（population_reference，仅 advisory；
# 升级 enforce 须按 README 流程补 ≥2 条 published doi）。
- id: AVE-001
  metric: protein_coding_gene_count
  taxon_scope: aves
  unit: genes
  expected_range: [12000, 25000]
  source_type: population_reference
  enforce: false
  references:
    - text: "T3 群体实测（2026-10-05，~/临时 27 物种 RefSeq GFF+FAA，t3_batch_report.tsv）"
      doi: null
  notes: >
    群体实测 protein-coding gene（gene loci 中含 CDS 者）：1 种 18,024（n=1，证据薄）。
    G. gallus 单锚； Isoform 比高（4.0）是 RefSeq 人工注释特征

- id: AVE-002
  metric: median_protein_length
  taxon_scope: aves
  unit: aa
  expected_range: [450, 600]
  source_type: population_reference
  enforce: false
  references:
    - text: "T3 群体实测（2026-10-05，~/临时 27 物种 RefSeq GFF+FAA，t3_batch_report.tsv）"
      doi: null
  notes: >
    群体实测蛋白中位长度：527。
