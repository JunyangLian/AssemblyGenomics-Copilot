# 真菌（fungi）注释指标基线。
# 来源：T3 群体校准 2026-10-05（population_reference，仅 advisory；
# 升级 enforce 须按 README 流程补 ≥2 条 published doi）。
- id: FUNGI-001
  metric: protein_coding_gene_count
  taxon_scope: fungi
  unit: genes
  expected_range: [4000, 8000]
  source_type: population_reference
  enforce: false
  references:
    - text: "T3 群体实测（2026-10-05，~/临时 27 物种 RefSeq GFF+FAA，t3_batch_report.tsv）"
      doi: null
  notes: >
    群体实测 protein-coding gene（gene loci 中含 CDS 者）：3 种酵母纲 5,179-5,607（n=3 有 GFF；另 2 种缺 GFF 未计入）。
    常见子囊菌编码基因多在五千至六千级

- id: FUNGI-002
  metric: median_protein_length
  taxon_scope: fungi
  unit: aa
  expected_range: [350, 500]
  source_type: population_reference
  enforce: false
  references:
    - text: "T3 群体实测（2026-10-05，~/临时 27 物种 RefSeq GFF+FAA，t3_batch_report.tsv）"
      doi: null
  notes: >
    群体实测蛋白中位长度：413-428。
