# 线虫类（nematoda）注释指标基线。
# 来源：T3 群体校准 2026-10-05（population_reference，仅 advisory；
# 升级 enforce 须按 README 流程补 ≥2 条 published doi）。
- id: NEM-001
  metric: protein_coding_gene_count
  taxon_scope: nematoda
  unit: genes
  expected_range: [8000, 35000]
  source_type: population_reference
  enforce: false
  references:
    - text: "T3 群体实测（2026-10-05，~/临时 27 物种 RefSeq GFF+FAA，t3_batch_report.tsv）"
      doi: null
  notes: >
    群体实测 protein-coding gene（gene loci 中含 CDS 者）：6 种 11,226-26,296（含 C. elegans 21,905、C. remanei 26,296）。
    B. malayi 偏低属正常；注意 gene loci 含大量非编码/假基因（C. elegans 44,795 座位中编码仅 21,905）

- id: NEM-002
  metric: median_protein_length
  taxon_scope: nematoda
  unit: aa
  expected_range: [150, 420]
  source_type: population_reference
  enforce: false
  references:
    - text: "T3 群体实测（2026-10-05，~/临时 27 物种 RefSeq GFF+FAA，t3_batch_report.tsv）"
      doi: null
  notes: >
    群体实测蛋白中位长度：191-362（Trichinella 191 属已知的短蛋白谱）。
